<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DBM Vircon DigiBox AR</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2933;
      background: #f4f7f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    main {
      width: min(920px, 100%);
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 14px 40px rgba(0,0,0,.12);
    }
    header {
      padding: 22px 24px 10px;
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: clamp(1.5rem, 4vw, 2.25rem); }
    p { margin: 0; color: #52606d; }
    model-viewer {
      width: 100%;
      height: min(68vh, 620px);
      background: #eef3f1;
    }
    .ar-button {
      background: #7fb800;
      color: white;
      border: 0;
      border-radius: 999px;
      padding: 14px 22px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,.18);
    }
    footer {
      padding: 14px 20px 20px;
      text-align: center;
      color: #52606d;
      font-size: .92rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>DBM Vircon DigiBox</h1>
      <p>View the 500 mm cube in 3D or place it in your space using AR.</p>
    </header>

    <model-viewer
      src="ar-box.glb"
      poster="poster.png"
      alt="DBM Vircon DigiBox 3D model"
      ar
      ar-modes="webxr scene-viewer quick-look"
      camera-controls
      auto-rotate
      shadow-intensity="1"
      exposure="1"
      interaction-prompt="auto">

      <button slot="ar-button" class="ar-button">
        View in AR
      </button>
    </model-viewer>

    <footer>
      On supported Android devices, AR opens through Scene Viewer or WebXR. On iPhone/iPad, Quick Look support may depend on Safari and automatic USDZ conversion.
    </footer>
  </main>
</body>
</html>
